---
- name: Install wpasupplicant packages
  ansible.builtin.apt:
    name="{{ pkgs }}"
    state="present"
    update_cache=False
    install_recommends=False
  vars:
    pkgs:
    - wpasupplicant

- name: wpa supplicant conf
  ansible.builtin.template:
    src: wpa_supplicant.conf.j2
    dest: /etc/wpa_supplicant/wpa_supplicant.conf
    owner: root
    group: root
    mode: 0600

