---
- name: Install wpasupplicant packages
  ansible.builtin.apt:
    name: "{{ pkgs }}"
    state: present
    update_cache: false
    install_recommends: false
  vars:
    pkgs:
      - wpasupplicant

- name: Wpa supplicant conf
  ansible.builtin.template:
    src: wpa_supplicant.conf.j2
    dest: /etc/wpa_supplicant/wpa_supplicant.conf
    owner: root
    group: root
    mode: "0600"
